version: "3"

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"   #Port 8081 gewählt, weil Port 8080 bereits durch Vaultwarden besetzt
    environment:
      TZ: 'Europe/Berlin'
      WEBPASSWORD: 'CHANGE_ME'
    volumes:
      - '/home/homeserver/pihole_data/pihole:/etc/pihole'
      - '/home/homeserver/pihole_data/dnsmasq:/etc/dnsmasq.d'
